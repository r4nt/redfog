# Loads uinput early at boot (systemd-modules-load.service, ordered before
# udev's coldplug trigger) so /dev/uinput already has a real sysfs device
# for 85-redfog-input.rules to apply to during that same boot's coldplug
# pass -- without this, the module stays unloaded until something happens
# to need it, and /dev/uinput sits as a generic kmod-generated 0600
# root:root placeholder (confirmed live: NOT what our udev rule's
# MODE=/GROUP= specify -- that placeholder comes from the kernel module's
# own built-in devname alias metadata, not from any udev rule at all) until
# the module actually loads and a real "add" uevent lets udev apply the
# real rule.
uinput
