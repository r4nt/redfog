# redfog configuration -- sourced as an EnvironmentFile by both
# redfog-broker.service and redfog-server.service. Shell-style KEY=VALUE,
# no quoting needed for simple values. Uncomment a line to override its
# default; anything left commented out uses redfog's own built-in default.
# After editing: systemctl restart redfog-broker redfog-server

## --- Cross-service wiring (redfog-broker) -- not really an admin knob,
## do not remove: tells the broker which identity redfog-server itself runs
## as, so it can grant that identity (not just the login target user) access
## to each session's runtime dir/Wayland socket. Must always match
## redfog-server.service's own User= -- if you ever change that, update this
## too. See redfog_broker::session::redfog_server_user's doc comment for why
## this exists: without it, redfog-server (running as its own unprivileged
## system user, not root) can't even see the sessions the broker spawns.
REDFOG_SERVER_USER=redfog

## --- Ports (redfog-server) ---
## Defaults match the real Moonlight/GameStream protocol's own port numbers.
#REDFOG_HTTP_PORT=47989
#REDFOG_HTTPS_PORT=47984
#REDFOG_RTSP_PORT=48010
#REDFOG_VIDEO_PORT=47998
#REDFOG_CONTROL_PORT=47999
#REDFOG_AUDIO_PORT=48000

## --- What the User stage runs (redfog-server) ---
## Space-separated command + args, e.g. "plasmashell --no-respawn" (the
## default -- streams your real KDE Plasma desktop) or a single game/app.
#REDFOG_USER_APP=plasmashell --no-respawn

## --- Compositor backend (redfog-server) ---
## "Kwin" (default) or "GstWaylandDisplay".
#REDFOG_BACKEND=Kwin

## --- Video encoder (redfog-server) ---
## Auto-detected by default (prefers NVENC if available). Force one
## explicitly with "nvenc", "nvenc-direct", or "software".
#REDFOG_VIDEO_ENCODER=software

## --- Session policy (redfog-server) ---
## Off by default: a second login as a username already active elsewhere
## is rejected rather than silently spawning a second, independent
## desktop for the same account. Set to 1 to allow it (e.g. for testing).
#REDFOG_ALLOW_CONCURRENT_SESSIONS_PER_USER=1

## --- Session picker (redfog-server) ---
## Presets offered on the login screen. See sessions.toml.example in the
## redfog source tree for the format; redfog falls back to a small
## built-in default list if this file doesn't exist.
#REDFOG_SESSIONS_CONFIG=/etc/redfog/sessions.toml

## --- Debug logging (redfog-server / redfog-broker) ---
#REDFOG_DEBUG_GST_DEBUG=3
#REDFOG_DEBUG_KWIN_LOGGING_RULES=kwin_core.debug=true
#REDFOG_DEBUG_PIPEWIRE_LOG=1
#REDFOG_LOG_MOUSE_EVENTS=1
