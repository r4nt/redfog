# CI hang backstop: several real, one-off hangs in redfog-moonlight's
# integration tests (a stuck subprocess call, a leaked background tokio
# task after a panic, and — still unreproduced locally — redfog-broker/
# redfog-server never receiving SIGTERM during test cleanup) each burned an
# entire 30-minute CI job before being individually root-caused, one at a
# time, across several rounds of `--nocapture`-enabled CI runs. Rather than
# keep chasing each new hang mechanism as it turns up, this makes any
# future one bounded regardless of cause: a test still running after
# `period` is marked slow, and killed after `terminate-after` more periods
# elapse — turning "the whole job hangs for 30 minutes" into "this one test
# fails after ~90s" once and for all. See .github/workflows/tests.yml's
# "Run tests with coverage" step for how this replaced a much more
# complicated (and, in the end, still insufficient) diagnostic wrapper.
[profile.default]
slow-timeout = { period = "90s", terminate-after = 1 }

# `redfog-core`'s two `av1_*_keyframe_*` tests (crates/redfog-core/src/
# lib.rs) do real GStreamer software AV1 encoding and, unlike everything
# else here, need a real number of access units to actually arrive (not
# just "eventually", see their own doc comments on why counting frames
# instead of wall-clock time matters) -- confirmed live across several CI
# runs that GitHub Actions' shared runners vary enough, run to run, that
# the shared 90s default sometimes isn't enough even for a deliberately
# small frame budget. A dedicated, more generous ceiling for just these
# two keeps the default 90s meaningful everywhere else (still the right
# backstop for a genuine hang) without this pair's own encoding-speed
# variance forcing that default upward for every other test.
[[profile.default.overrides]]
filter = 'package(redfog-core) and test(keyframe)'
slow-timeout = { period = "60s", terminate-after = 4 }
