[package]
name = "redfog-moonlight"
version = "0.1.0"
edition = "2021"

[features]
# Gates connection_integration.rs's tests that need a real, working
# User-stage compositor (Xwayland segfaults spawning a headless, no-DRM-
# device KWin backend -- confirmed live, not fixable in redfog's own code).
# A cargo feature, not #[ignore] -- see that attribute's own removal from
# these tests for why: #[ignore] plus --include-ignored can't distinguish
# "ignored because this machine lacks the hardware" from "ignored because
# it's actually broken and needs fixing" -- they're both just "ignored",
# forcing test-all to hand-maintain a --skip list naming every genuinely
# broken test to undo --include-ignored's blanket sweep. A feature flag
# means these tests don't exist at all in a build without it -- no
# --include-ignored, no --skip list, and #[ignore] stays free to mean
# exactly one thing: this specific test is broken, not that a whole
# category needs different hardware.
compositor-tests = []

[dependencies]
redfog-core = { path = "../redfog-core" }
session-backend = { path = "../session-backend" }
redfog-broker-protocol = { path = "../redfog-broker-protocol" }
redfog-login-protocol = { path = "../redfog-login-protocol" }
gstreamer = "0.21"

tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
form_urlencoded = "1"

rtsp-types = "0.1"
sdp-types = "0.1"

tokio-enet = "0.1"

rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.14"
rustls-pki-types = "1.4"
rsa = "0.9"
pkcs8 = "0.11"
x509-parser = "0.18"
aes = "0.8"
cbc = "0.1"
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

mdns-sd = "0.13"
gethostname = "0.5"

# Real production use (unlike the dev-dependencies libc/nix below, which
# stay separate -- these are for udp_sender.rs's sendmmsg batching
# specifically, see that file's own doc comment): libc for the raw
# sendmmsg/mmsghdr FFI (no safe wrapper for it exists in the ecosystem
# worth pulling in a whole crate for), socket2 for SockAddr -- converting a
# std::net::SocketAddr into a raw sockaddr correctly (v4 vs v6, byte order)
# by hand is exactly the kind of unsafe-adjacent code worth not
# hand-rolling. Already in the dependency tree transitively via tokio/
# hyper-util at a compatible version -- this doesn't add a new one.
libc = "0.2"
socket2 = "0.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"

# BSD-2-Clause, real production dependency (unlike moonlight-common below,
# GPL and dev-only) -- SIMD-accelerated Reed-Solomon erasure coding for
# audio/video FEC parity shards. Same crate the vendored reference client
# uses for reconstruction (see vendor/moonlight-common-rust/Cargo.toml),
# used here on the encode side so both halves share the exact same GF(2^8)
# arithmetic -- load-bearing, not just a convenience: real clients expect a
# specific, non-default parity matrix (see audio.rs) that only produces
# correct results if encoder and decoder agree on the underlying field.
fec-rs = "0.1"

[dev-dependencies]
ureq = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.26", features = ["signal"] }
# libc is now a real (non-dev) dependency above, covering test builds too.
redfog-test-cleanup = { path = "../redfog-test-cleanup" }
# GPL-3.0-or-later, dev-only: the real reference client implementation, used
# to validate our server against actual client-side crypto/parsing rather
# than our own (possibly-biased) reimplementation of both sides.
moonlight-common = { git = "https://github.com/MrCreativ3001/moonlight-common-rust", default-features = false, features = ["tokio-hyper", "rustcrypto"] }
pem = "3"
